name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rules, the retrograde book, the φ algebra and the shipped campaign are all pure ES
  # modules: no browser, no install step, no dependency resolution anywhere in this repo.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Suites
        run: for f in test/*.test.mjs; do echo "::group::$f"; node "$f"; echo "::endgroup::"; done
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # js/data/lots.js is GENERATED (tools/bake.mjs: bottom-up grid + φ algebra reconciled
  # state-for-state, then the campaign curated out of it), so it can drift from the code that
  # produced it. Two checks: re-baking must reproduce the shipped file byte for byte apart from
  # the BAKED_AT line, and the page that ships must still be the page the tests were written
  # against (a shell with no canvas is a 404-shaped success).
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shipped book re-derives from the bake (timestamp line aside)
        run: |
          cp js/data/lots.js /tmp/shipped.js
          node tools/bake.mjs
          norm() { sed -E 's/^export const BAKED_AT = .*/export const BAKED_AT = "T";/' "$1"; }
          norm /tmp/shipped.js > /tmp/a.js
          norm js/data/lots.js > /tmp/b.js
          cmp /tmp/a.js /tmp/b.js
      - name: The shell is a real page
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html

  # The shell is only proven by driving a real page with real mouse events: the canvas hit test,
  # the k buttons, the save file, the 必败 panel and the φ·b guide line all live behind
  # `window.euclid` and the pixels of one canvas.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 420
        run: bash tools/verify.sh
      # The same scenarios against the URL shape production actually uses. GitHub Pages serves this
      # repo under a path prefix (`https://z-biz-game.github.io/<repo>/`), while server.cjs makes the
      # repo the document ROOT — and a root-shaped server cannot tell a specifier with a leading
      # slash apart from a relative one. Page-side code written against the root-shaped server passes
      # every local gate and then 404s in production, and one failed dynamic import takes the whole
      # injected script down: the sibling repo lost 19 assertions that way, silently.
      - name: Headless playtest under a path prefix (how Pages serves us)
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 420
          WEB_PORT: 5298
          CDP_PORT: 9398
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-euclid-cos"
          python3 -m http.server 5299 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 http://127.0.0.1:5299/z-biz-game-euclid-cos/ >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 http://127.0.0.1:5299/z-biz-game-euclid-cos/js/main.js >/dev/null
          SKIP_UNIT=1 ALLOW_ORPHAN_CHROME=1 \
            BASE_URL=http://127.0.0.1:5299/z-biz-game-euclid-cos/ \
            bash tools/verify.sh

